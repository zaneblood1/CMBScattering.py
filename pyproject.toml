[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-scattering"
version = "0.1.0"
description = "Inference of the tensor-to-scalar ratio in the flat sky using scattering transform summary statistics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zane Blood" }]
dependencies = [
    # CMBLensing.py is not on PyPI, so it is installed straight from GitHub.
    "cmb-lensing @ git+https://github.com/zaneblood1/CMBLensing.py.git",
    "jax>=0.9.2",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]
#PySM dust maps for simulate_data(dust_model = "pysm")
pysm = [
    "pysm3>=3.4",
    "healpy>=1.16",
]

[project.urls]
Repository = "https://github.com/zaneblood1/CMBScattering.py"

[tool.setuptools.packages.find]
include = ["cmb_scattering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
